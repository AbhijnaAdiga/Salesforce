<template>
    <lightning-card title="Modal Popup">
        <lightning-button label="Create University" variant="brand" onclick={OpenModalHandle}></lightning-button>
    </lightning-card>
    <template lwc:if={isModalOpen}>
        <section role="dialog" tabindex="-1" aria-modal="true" aria-labelledby="modal-heading-01" class="slds-modal slds-fade-in-open">
  <div class="slds-modal__container">
    <button class="slds-button slds-button_icon slds-modal__close">
      <svg class="slds-button__icon slds-button__icon_large" aria-hidden="true">
        <use xlink:href="/assets/icons/utility-sprite/svg/symbols.svg#close"></use>
      </svg>
      <span class="slds-assistive-text">Cancel and close</span>
    </button>
    <div class="slds-modal__header">
      <h1 id="modal-heading-01" class="slds-modal__title slds-hyphenate" tabindex="-1">Modal header</h1>
    </div>
    <div class="slds-modal__content slds-p-around_medium" id="modal-content-id-1">
      <lightning-record-edit-form
      object-api-name="University__c"
      >
      <lightning-input-field field-name="Name"></lightning-input-field>
      <lightning-input-field field-name="Website__c"></lightning-input-field>
      
        </lightning-record-edit-form>
    </div>
    <div class="slds-modal__footer">
      <button class="slds-button slds-button_neutral" aria-label="Cancel and close" onclick={resethandler}>Cancel</button>
      <button class="slds-button slds-button_brand" onclick={handlesubmit}>Save</button>
    </div>
  </div>
</section>
<div class="slds-backdrop slds-backdrop_open" role="presentation"></div>
    </template>
</template>
