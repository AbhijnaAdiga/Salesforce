<template>
    <lightning-card title="Datatable with Search">
        <div class="slds-m-around_medium">
            <lightning-input type="search" label="Search" value={searchKey} onchange={handleSearchKeyChange}></lightning-input>
            <lightning-datatable
                key-field="id"
                data={filteredData}
                columns={columns}
            ></lightning-datatable>
        </div>
    </lightning-card>
</template>
